specVersion: "3.0"

metadata:
  name: smartprocure360

type: application

resources:
  configuration:
    paths:
      webapp: .

server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /sap
      configuration:
        baseUri: "https://merida.cob.csuchico.edu:8038/sap"
        strictSSL: true
        query:
          sap-client: "105"